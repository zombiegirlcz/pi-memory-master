collections:
  docs_config_memo:
    path: /root/docs_config_memo
    pattern: "**/*.md"
    context:
      "": .
  pi-memory:
    path: /root/docs_config_memo/.pi/agent/memory
    pattern: "**/*.md"
  pi-hidden:
    path: /root/docs_config_memo/.pi
    pattern: "**/*.md"
    ignore:
      - "agent/memory/**"
  config-hidden:
    path: /root/docs_config_memo/.config
    pattern: "**/*.md"
  copilot-hidden:
    path: /root/docs_config_memo/.copilot
    pattern: "**/*.md"
  gemini-brain:
    path: /root/docs_config_memo/.gemini
    pattern: "**/*.md"
    context:
      "/": "Antigravity/Gemini CLI brain: plans, analyses, session notes"
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
global_context: "Curated long-term memory: decisions, preferences, facts, lessons"
